name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
        working-directory: ./backend
      - run: npx tsc --noEmit
      #   working-directory: ./backend
      # - run: bun run test
      #   working-directory: ./backend
      # - run: bun run build
      #   working-directory: ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
        working-directory: ./frontend
      - run: bun run build
        working-directory: ./frontend
      - run: bun run lint
        working-directory: ./frontend
